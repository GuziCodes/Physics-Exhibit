<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Physics VR Exhibit — Seismic Tsunami Waves</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="tsunami.js"></script>
  </head>
  <body>

<a-scene
  tsunami-loop
  renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
  fog="type: exponential; color: #a9d9ed; density: 0.003"
  shadow="type: pcfsoft"
>

  <!-- ================================================= -->
  <!-- SKY / ATMOSPHERE                                  -->
  <!-- ================================================= -->

  <a-sky id="sky" color="#78c5e8"></a-sky>

  <!-- Soft atmospheric haze -->
  <a-sphere
    position="40 25 -50"
    radius="18"
    color="#bdeaff"
    material="shader: flat; transparent: true; opacity: 0.10"
  ></a-sphere>

  <!-- Storm cloud layer (revealed in later phases) -->
  <a-entity id="cloud-layer" position="0 25 -20" visible="false">
    <a-plane
      width="90" height="45"
      position="0 0 0"
      color="#4a5568"
      material="shader: flat; transparent: true; opacity: 0.32; side: double"
    ></a-plane>
    <a-plane
      width="75" height="35"
      position="12 -3 6"
      color="#2d3748"
      material="shader: flat; transparent: true; opacity: 0.26; side: double"
    ></a-plane>
    <a-plane
      width="60" height="28"
      position="-15 -4 4"
      color="#3a4555"
      material="shader: flat; transparent: true; opacity: 0.22; side: double"
    ></a-plane>
  </a-entity>

  <!-- ================================================= -->
  <!-- SUN                                               -->
  <!-- ================================================= -->

  <a-entity id="sun" position="34 20 -50">
    <a-sphere radius="5.5" color="#fff1bd"
      material="shader: flat; transparent: true; opacity: 0.14"
    ></a-sphere>
    <a-sphere radius="3.5" color="#fff7d6"
      material="shader: flat; transparent: true; opacity: 0.20"
    ></a-sphere>
    <a-sphere radius="2.2" color="#fffbea" material="shader: flat"></a-sphere>
    <a-entity
      id="sun-light"
      light="type: directional; color: #fff3d6; intensity: 1.35; castShadow: true"
      position="0 0 0"
    ></a-entity>
  </a-entity>

  <!-- ================================================= -->
  <!-- ENVIRONMENT LIGHTING                              -->
  <!-- ================================================= -->

  <a-entity
    id="ambient-light"
    light="type: ambient; color: #d5efff; intensity: 0.65"
  ></a-entity>

  <a-entity
    id="hemisphere-light"
    light="type: hemisphere; color: #63c9ee; groundColor: #b48c54; intensity: 0.45"
  ></a-entity>

  <!-- ================================================= -->
  <!-- ALARM / WARNING LIGHTS                            -->
  <!-- ================================================= -->

  <a-entity
    id="alarm-light"
    light="type: point; color: #ff2020; intensity: 0; distance: 25; decay: 2"
    position="3.5 4 1"
  ></a-entity>

  <a-entity
    id="alarm-light-2"
    light="type: point; color: #ff1a1a; intensity: 0; distance: 20; decay: 2"
    position="-3.5 4 1"
  ></a-entity>

  <!-- Warning accent under info board -->
  <a-plane
    id="warning-bar"
    position="0 2.08 -7.78"
    width="6.6"
    height="0.035"
    color="#ff2020"
    material="shader: flat; transparent: true; opacity: 0"
  ></a-plane>

  <!-- ================================================= -->
  <!-- PHYSICS INFORMATION PANEL                         -->
  <!-- ================================================= -->

  <a-entity id="info-board" position="0 3.15 -8">

    <!-- Outer frame -->
    <a-box
      position="0 0 -0.07"
      width="7.05" height="2.15" depth="0.10"
      color="#06131c"
      material="roughness: 0.4; metalness: 0.55"
    ></a-box>

    <!-- Inner bezel -->
    <a-box
      position="0 0 -0.04"
      width="6.85" height="1.95" depth="0.06"
      color="#0a1f2e"
      material="roughness: 0.35; metalness: 0.4"
    ></a-box>

    <!-- Display surface -->
    <a-plane
      id="status-panel"
      width="6.55" height="1.70"
      color="#0b2638"
      opacity="0.96"
      material="shader: flat; transparent: true"
    ></a-plane>

    <!-- Top accent line -->
    <a-plane
      position="0 0.82 0.015"
      width="6.35" height="0.018"
      color="#1a9bb8"
      material="shader: flat"
    ></a-plane>

    <!-- Bottom accent line -->
    <a-plane
      position="0 -0.82 0.015"
      width="6.35" height="0.018"
      color="#28d9ff"
      material="shader: flat"
    ></a-plane>

    <!-- Left vertical accent -->
    <a-plane
      position="-3.22 0 0.015"
      width="0.018" height="1.55"
      color="#1a9bb8"
      material="shader: flat"
    ></a-plane>

    <!-- Section labels -->
    <a-text
      value="PHYSICS EXHIBIT"
      position="-3.05 0.60 0.03"
      color="#67e8ff"
      width="3.0"
      align="left"
      font="roboto"
    ></a-text>

    <a-text
      value="KINETIC TSUNAMI  ·  WAVE SPEED"
      position="-3.05 0.38 0.03"
      color="#ffffff"
      width="5.6"
      align="left"
    ></a-text>

    <!-- Divider -->
    <a-plane
      position="-0.4 0.18 0.02"
      width="5.8" height="0.008"
      color="#1a4a5c"
      material="shader: flat; transparent: true; opacity: 0.7"
    ></a-plane>

    <!-- Live status -->
    <a-text
      id="status-text"
      value="INITIALIZING..."
      position="-3.05 -0.15 0.03"
      color="#d9f7ff"
      width="5.2"
      align="left"
      line-height="48"
    ></a-text>

    <!-- Data column header -->
    <a-text
      value="LIVE DATA"
      position="2.85 0.58 0.03"
      color="#4a9bb0"
      width="1.8"
      align="right"
    ></a-text>

    <!-- Data readouts -->
    <a-text
      id="data-readout-1"
      value=""
      position="2.85 0.28 0.03"
      color="#67e8ff"
      width="2.0"
      align="right"
      line-height="40"
    ></a-text>

    <a-text
      id="data-readout-2"
      value=""
      position="2.85 -0.25 0.03"
      color="#90e8ff"
      width="2.0"
      align="right"
      line-height="40"
    ></a-text>

  </a-entity>


  <!-- ================================================= -->
  <!-- PRESENTED BY — RIGHT PANEL                        -->
  <!-- Visible when user looks right                     -->
  <!-- ================================================= -->

  <a-entity id="presented-by-board" position="3 3 2" rotation="0 -120 0">

    <!-- Outer frame -->
    <a-box
      position="0 0 -0.06"
      width="3.4" height="1.55" depth="0.09"
      color="#06131c"
      material="roughness: 0.4; metalness: 0.55"
    ></a-box>

    <!-- Inner bezel -->
    <a-box
      position="0 0 -0.035"
      width="3.2" height="1.38" depth="0.05"
      color="#0a1f2e"
      material="roughness: 0.35; metalness: 0.4"
    ></a-box>

    <!-- Display surface -->
    <a-plane
      width="3.05" height="1.25"
      color="#0b2638"
      opacity="0.96"
      material="shader: flat; transparent: true"
    ></a-plane>

    <!-- Top accent -->
    <a-plane
      position="0 0.58 0.012"
      width="2.9" height="0.014"
      color="#1a9bb8"
      material="shader: flat"
    ></a-plane>

    <!-- Bottom accent -->
    <a-plane
      position="0 -0.58 0.012"
      width="2.9" height="0.014"
      color="#28d9ff"
      material="shader: flat"
    ></a-plane>

    <a-text
      value="PRESENTED BY"
      position="0 0.32 0.025"
      color="#67e8ff"
      width="2.8"
      align="center"
      font="roboto"
    ></a-text>

    <a-text
      value="12 STEM-A"
      position="0 -0.08 0.025"
      color="#ffffff"
      width="3.4"
      align="center"
    ></a-text>

    <a-text
      value="PHYSICS VR EXHIBIT"
      position="0 -0.38 0.025"
      color="#4a9bb0"
      width="2.6"
      align="center"
    ></a-text>

  </a-entity>


  <!-- ================================================= -->
  <!-- CUSTOM IMAGE FRAMES — LEFT SIDE                   -->
  <!-- ================================================= -->

  <!-- Frame 1 (upper left) — alden.jpeg -->
  <a-entity id="left-frame-1" position="-5 4 5" rotation="10 90 0">
    <a-box
      position="5 0 -0.06"
      width="2.8" height="2.2" depth="0.10"
      color="#06131c"
      material="roughness: 0.4; metalness: 0.55"
    ></a-box>
    <a-box
      position="5 0 -0.03"
      width="2.6" height="2.0" depth="0.06"
      color="#0a1f2e"
      material="roughness: 0.35; metalness: 0.4"
    ></a-box>
    <a-image
      id="left-image-1"
      src="alden.jpeg"
      width="2.4"
      height="1.8"
      position="5 0 0.02"
    ></a-image>
    <a-plane position="5 0.97 0.03" width="2.5" height="0.015" color="#28d9ff" material="shader: flat"></a-plane>
    <a-plane position="5 -0.97 0.03" width="2.5" height="0.015" color="#28d9ff" material="shader: flat"></a-plane>
  </a-entity>

  <!-- Frame 2 (lower left) — jaro.jpeg -->
  <a-entity id="left-frame-2" position="-4 4 5" rotation="20 130 0">
    <a-box
      position="1 2 -0.06"
      width="2.8" height="2.2" depth="0.10"
      color="#06131c"
      material="roughness: 0.4; metalness: 0.55"
    ></a-box>
    <a-box
      position="1 2 -0.03"
      width="2.6" height="2.0" depth="0.06"
      color="#0a1f2e"
      material="roughness: 0.35; metalness: 0.4"
    ></a-box>
    <a-image
      id="left-image-2"
      src="jaro.jpeg"
      width="2.4"
      height="1.8"
      position="1 2 0.02"
    ></a-image>
    <a-plane position="1 3 0.03" width="2.5" height="0.015" color="#28d9ff" material="shader: flat"></a-plane>
    <a-plane position="1 1 0.03" width="2.5" height="0.015" color="#28d9ff" material="shader: flat"></a-plane>
  </a-entity>
<!--THIRD PUTOOO-->
   <a-entity id="left-frame-3" position="-4 1 5" rotation="-10 130 0">
    <a-box
      position="1 2 -0.06"
      width="2.8" height="2.2" depth="0.20"
      color="#06131c"
      material="roughness: 0.4; metalness: 0.55"
    ></a-box>
    <a-box
      position="1 2 -0.03"
      width="2.6" height="2.0" depth="0.20"
      color="#0a1f2e"
      material="roughness: 0.35; metalness: 0.4"
    ></a-box>
    <a-image
      id="left-image-2"
      src="Archi.jpeg"
      width="2.4"
      height="1.8"
      position="1 2 0.20"
    ></a-image>
    <a-plane position="1 2.99 0.20" width="2.5" height="0.015" color="#28d9ff" material="shader: flat"></a-plane>
    <a-plane position="1 1.015 0.20" width="2.5" height="0.015" color="#28d9ff" material="shader: flat"></a-plane>
  </a-entity>


  <!-- ================================================= -->
  <!-- TEAM CREDITS — BEHIND VIEWER                      -->
  <!-- Visible when user turns around                    -->
  <!-- ================================================= -->

  <a-entity id="team-credits-board" position="0 2.85 5.5" rotation="0 180 0">

    <!-- Outer frame -->
    <a-box
      position="0 0 -0.07"
      width="5.2" height="4" depth="0.10"
      color="#06131c"
      material="roughness: 0.4; metalness: 0.55"
    ></a-box>

    <!-- Inner bezel -->
    <a-box
      position="0 0 -0.04"
      width="5.0" height="3.7" depth="0.06"
      color="#0a1f2e"
      material="roughness: 0.35; metalness: 0.4"
    ></a-box>

    <!-- Display surface -->
    <a-plane
      width="4.8" height="3.7"
      color="#0b2638"
      opacity="0.96"
      material="shader: flat; transparent: true"
    ></a-plane>

    <!-- Top accent -->
    <a-plane
      position="0 1.65 0.015"
      width="4.6" height="0.05"
      color="#1a9bb8"
      material="shader: flat"
    ></a-plane>

    <!-- Bottom accent -->
    <a-plane
      position="0 -1.65 0.015"
      width="4.6" height="0.05"
      color="#28d9ff"
      material="shader: flat"
    ></a-plane>

    <!-- Header -->
    <a-text
      value="TEAM CREDITS"
      position="0 1.50 0.03"
      color="#67e8ff"
      width="3.2"
      align="center"
      font="roboto"
    ></a-text>

    <a-text
      value="12 STEM-A  ·  PROJECT TEAM"
      position="0 1.30 0.03"
      color="#4a9bb0"
      width="3.6"
      align="center"
    ></a-text>

    <!-- Divider -->
    <a-plane
      position="0 1.15 0.02"
      width="4.0" height="0.008"
      color="#1a4a5c"
      material="shader: flat; transparent: true; opacity: 0.7"
    ></a-plane>

    <!-- Names Lamang dito -->
    <a-text value="1.  Guzi Emmanuel Jarangue"   position="0  1.0 0.03" color="#e8f7ff" width="4.0" align="center"></a-text>
    <a-text value="2.  Jurvila Felaine Jaboneta"   position="0  0.75 0.03" color="#e8f7ff" width="4.0" align="center"></a-text>
    <a-text value="3.  Ashley Nicole Ledesma" position="0  0.50 0.03" color="#e8f7ff" width="4.0" align="center"></a-text>
    <a-text value="4.  Ella Capaducio"  position="0 0.25 0.03" color="#e8f7ff" width="4.0" align="center"></a-text>
    <a-text value="5.  Jjanev Machaddo Matta"  position="0 0 0.03" color="#e8f7ff" width="4.0" align="center"></a-text>
    <a-text value="6.  Alejandro III Abanero"   position="0 -0.25 0.03" color="#e8f7ff" width="4.0" align="center"></a-text>
    <a-text value="7.  Rene B. Rillo Jr." position="0 -0.50 0.03" color="#e8f7ff" width="4.0" align="center"></a-text>
    <a-text value="8.  Jiereed Elijah T. Dalida" position="0 -0.75 0.03" color="#e8f7ff" width="4.0" align="center"></a-text>
    <a-text value="9.  Ryan James B. Paca"  position="0 -1.0 0.03" color="#e8f7ff" width="4.0" align="center"></a-text>
    <a-text value="10.  Patrick G. Arsenal"  position="0 -1.25 0.03" color="#e8f7ff" width="4.0" align="center"></a-text>


  </a-entity>


  <!-- ================================================= -->
  <!-- OBSERVATION PLATFORM                              -->
  <!-- ================================================= -->

  <a-cylinder
    position="0 -1.5 5"
    radius="2.40" height="0.20"
    color="#121a28"
    material="roughness: 0.55; metalness: 0.40"
  ></a-cylinder>

  <a-cylinder
    position="0 -1.38 5"
    radius="2.15" height="0.04"
    color="#1c283c"
    material="roughness: 0.35; metalness: 0.25"
  ></a-cylinder>

  <!-- Outer glow ring -->
  <a-torus
    position="0 -1.34 5"
    radius="2.22" radius-tubular="0.030"
    color="#27d9ff"
    material="shader: flat; transparent: true; opacity: 0.70"
  ></a-torus>

  <!-- Inner ring -->
  <a-torus
    position="0 -1.335 5"
    radius="1.98" radius-tubular="0.010"
    color="#4c6f89"
    material="shader: flat; transparent: true; opacity: 0.40"
  ></a-torus>

  <!-- ================================================= -->
  <!-- SEAFLOOR                                          -->
  <!-- ================================================= -->

  <a-entity id="seafloor-group" position="0 -1.08 -7">

    <a-plane
      id="seafloor"
      width="132" height="132"
      rotation="-90 0 0"
      color="#1a2a3a"
      material="shader: standard; roughness: 1; metalness: 0"
    ></a-plane>

    <a-plane
      width="132.4" height="132.4"
      rotation="-90 0 0"
      position="0 -0.02 0"
      color="#0f1a28"
      material="shader: standard; roughness: 1; metalness: 0"
    ></a-plane>

    <a-entity id="cracks" scale="0.2 0.2 0.2"></a-entity>

  </a-entity>

  <!-- ================================================= -->
  <!-- OCEAN                                             -->
  <!-- ================================================= -->

  <a-entity id="ocean-container" position="0 -1 -6" rotation="-90 0 0">

    <!-- Main surface -->
    <a-plane
      id="ocean-grid"
      width="128" height="128"
      segments-width="32" segments-height="32"
      color="#0a4d8f"
      opacity="0.74"
      side="double"
      material="shader: standard; transparent: true; roughness: 0.25; metalness: 0.08"
    ></a-plane>

    <!-- Subtle foam / swell layer -->
    <a-plane
      id="foam-layer"
      width="120" height="120"
      segments-width="16" segments-height="16"
      color="#c8f0ff"
      opacity="0.0"
      position="0 -0.015 0"
      side="double"
      material="shader: standard; transparent: true; roughness: 0.15; metalness: 0.0"
    ></a-plane>

    <!-- Water highlight layer -->
    <a-plane
      id="water-highlight"
      width="119" height="119"
      segments-width="24" segments-height="24"
      color="#249ed0"
      opacity="0.12"
      side="double"
      position="0 0.018 0"
      material="shader: standard; transparent: true; roughness: 0.18; metalness: 0.02"
    ></a-plane>

    <!-- Wireframe overlay (scientific feel) -->
    <a-plane
      id="ocean-wireframe"
      width="128" height="128"
      segments-width="16" segments-height="16"
      color="#69ddff"
      wireframe="true"
      opacity="0.18"
      position="0 0.035 0"
    ></a-plane>

  </a-entity>

  <!-- ================================================= -->
  <!-- GIANT TSUNAMI WAVE                                -->
  <!-- ================================================= -->

  <a-entity id="tsunami-wave"></a-entity>

  <!-- ================================================= -->
  <!-- RAIN (storm phases)                               -->
  <!-- ================================================= -->

  <a-entity id="rain-container" position="0 15 -8" visible="false"></a-entity>

  <!-- ================================================= -->
  <!-- OCEAN DEBRIS                                      -->
  <!-- ================================================= -->

  <a-entity id="ocean-debris-container" position="0 0 -6"></a-entity>

  <!-- ================================================= -->
  <!-- FAULT ZONE                                        -->
  <!-- ================================================= -->

  <a-box
    id="fault-line"
    position="0 -1.15 -9.5"
    width="18" height="0.28" depth="0.75"
    color="#3c2a1e"
    material="emissive: #ff334f; emissiveIntensity: 0; roughness: 0.9; metalness: 0.05"
  ></a-box>

  <!-- Secondary fault ridges -->
  <a-box
    position="0 -1.02 -9.5"
    width="16" height="0.07" depth="0.38"
    color="#2a1c12"
    material="roughness: 1; metalness: 0"
  ></a-box>
  <a-box
    position="0 -1.28 -9.5"
    width="14" height="0.05" depth="0.28"
    color="#2a1c12"
    material="roughness: 1; metalness: 0"
  ></a-box>

  <a-entity
    id="fault-light"
    light="type: point; color: #ff365d; intensity: 0; distance: 18; decay: 2"
    position="0 -0.8 -9.5"
  ></a-entity>

  <a-text
    value="FAULT LINE"
    position="0 0.5 -9.15"
    color="#ff6680"
    width="15"
    align="center"
  ></a-text>

  <a-text
    value="EPICENTER"
    position="0 -0.3 -9.15"
    color="#ffd0d7"
    width="10"
    align="center"
  ></a-text>

  <!-- ================================================= -->
  <!-- SEAFLOOR DEBRIS                                   -->
  <!-- ================================================= -->

  <a-entity id="seafloor-debris">
    <a-icosahedron position="-4.4 -1.25 -10.2" radius="0.16"
      color="#75634c" material="roughness: 1"></a-icosahedron>
    <a-icosahedron position="3.6 -1.24 -10.0" radius="0.12"
      color="#695843" material="roughness: 1"></a-icosahedron>
    <a-icosahedron position="-2.2 -1.27 -11.1" radius="0.10"
      color="#806d52" material="roughness: 1"></a-icosahedron>
    <a-icosahedron position="4.7 -1.25 -8.8" radius="0.09"
      color="#6b5a45" material="roughness: 1"></a-icosahedron>
    <a-icosahedron position="-5.8 -1.26 -9.1" radius="0.13"
      color="#7a6850" material="roughness: 1"></a-icosahedron>
    <a-icosahedron position="1.8 -1.25 -12.0" radius="0.11"
      color="#6e5c48" material="roughness: 1"></a-icosahedron>
  </a-entity>

  <!-- ================================================= -->
  <!-- DEPTH MARKERS                                     -->
  <!-- ================================================= -->

  <a-ring
    position="0 -1.285 -13.2"
    rotation="-90 0 0"
    radius-inner="2.8" radius-outer="2.83"
    color="#75dfff"
    material="shader: flat; transparent: true; opacity: 0.12"
  ></a-ring>

  <a-ring
    position="0 -1.285 -15.5"
    rotation="-90 0 0"
    radius-inner="4.0" radius-outer="4.03"
    color="#75dfff"
    material="shader: flat; transparent: true; opacity: 0.08"
  ></a-ring>

  <a-ring
    position="0 -1.285 -18.0"
    rotation="-90 0 0"
    radius-inner="5.5" radius-outer="5.53"
    color="#75dfff"
    material="shader: flat; transparent: true; opacity: 0.05"
  ></a-ring>

  <!-- ================================================= -->
  <!-- CAMERA                                            -->
  <!-- ================================================= -->

  <a-entity id="camera-rig" position="0 3 5">
    <a-camera look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>
  </a-entity>

</a-scene>

  </body>
</html>>
