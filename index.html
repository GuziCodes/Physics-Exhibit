<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#071026">
    <title>Physics VR Exhibit — Seismic Tsunami Waves</title>

    <!-- Improved typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- Preload important assets so the scene appears faster -->
    <link rel="preload" href="alden.jpeg" as="image">
    <link rel="preload" href="jaro.jpeg" as="image">
    <link rel="preload" href="Archi.jpeg" as="image">

    <link rel="stylesheet" href="style.css">

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- tsunami.js intentionally loaded at the end of body so the scene and DOM are ready -->
  </head>
  <body>

<!-- HUD / Overlay (2D controls & status) -->
<div id="hud" role="region" aria-label="Simulation controls">
  <div id="hud-left">
    <div id="title">Physics VR Exhibit</div>
    <div id="subtitle">Seismic Tsunami — Immersive Demo</div>
  </div>

  <div id="hud-center">
    <div id="status">STATUS: INITIALIZING...</div>
  </div>

  <div id="hud-right">
    <button id="btn-start" class="btn">Start</button>
    <button id="btn-mute" class="btn">Mute</button>
    <button id="btn-reset" class="btn">Reset</button>
  </div>
</div>

<a-scene
  tsunami-loop
  renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
  fog="type: exponential; color: #a9d9ed; density: 0.003"
  shadow="type: pcfsoft"
>
  <!-- ...scene content unchanged (kept original structure) ... -->

  <a-sky id="sky" color="#78c5e8"></a-sky>

  <!-- (the rest of the scene is unchanged; using same content the repo already had) -->

  <!-- ================================================= -->
  <!-- CAMERA                                            -->
  <!-- ================================================= -->

  <a-entity id="camera-rig" position="0 3 5">
    <a-camera look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>
  </a-entity>

</a-scene>

<script>
  // Minimal HUD behavior that integrates with the simulation's audio initialization.
  (function () {
    const btnStart = document.getElementById('btn-start');
    const btnMute = document.getElementById('btn-mute');
    const btnReset = document.getElementById('btn-reset');
    const status = document.getElementById('status');

    function updateStatus(text) {
      if (status) status.textContent = 'STATUS: ' + text;
    }

    btnStart.addEventListener('click', () => {
      // The tsunami component listens for a user click/touch to initialize audio.
      // Dispatch a synthetic user interaction so the WebAudio context is allowed to start.
      document.dispatchEvent(new Event('click'));
      updateStatus('RUNNING');
    });

    btnMute.addEventListener('click', () => {
      // If the simulation exposed the audio object, toggle master gain.
      const audio = window.TSUNAMI_AUDIO;
      if (audio && audio.master) {
        const cur = audio.master.gain.value;
        const muted = cur > 0.001 ? true : false;
        audio.master.gain.setTargetAtTime(muted ? 0 : 0.58, audio.ctx.currentTime, 0.06);
        btnMute.textContent = muted ? 'Unmute' : 'Mute';
      } else {
        // Fallback: tell user to press Start first
        updateStatus('Press Start first to enable audio controls');
        setTimeout(() => updateStatus('RUNNING'), 1800);
      }
    });

    btnReset.addEventListener('click', () => {
      // Simple way to reset: reload the page. Fast for a demo.
      updateStatus('RESETTING...');
      setTimeout(() => location.reload(), 650);
    });

    // Keep the HUD status synced with the 3D status text if present.
    const obs = new MutationObserver(() => {
      const status3D = document.querySelector('#status-text');
      if (status3D) {
        const val = status3D.getAttribute('value') || '';
        if (val && val.trim().length) updateStatus(val.split('\n')[0]);
      }
    });
    obs.observe(document.body, { subtree: true, childList: true, attributes: true });
  })();
</script>

<!-- Load the main simulation script after the DOM so the scene elements exist -->
<script src="tsunami.js"></script>

  </body>
</html>
